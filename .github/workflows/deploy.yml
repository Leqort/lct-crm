name: Test deploy

on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: ghcr.io

concurrency:
  group: test-deploy
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy app

      - name: Tests
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm_test
          ENV: local
          AUTH_MODE: dev
        run: pytest

  publish:
    name: Build and publish image
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to test server
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure SSH host key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/docker/keycloak' '$DEPLOY_PATH/docker/prometheus' \
              '$DEPLOY_PATH/docker/grafana/provisioning' '$DEPLOY_PATH/docker/grafana/dashboards'; \
              if [ -d '$DEPLOY_PATH/docker/prometheus/prometheus.yml' ]; then \
                rmdir '$DEPLOY_PATH/docker/prometheus/prometheus.yml'; \
              fi"
          scp -P "${DEPLOY_PORT:-22}" docker-compose.deploy.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.deploy.yml"
          scp -P "${DEPLOY_PORT:-22}" docker/Caddyfile \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker/Caddyfile"
          scp -P "${DEPLOY_PORT:-22}" docker/prometheus/prometheus.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker/prometheus/prometheus.yml"
          scp -P "${DEPLOY_PORT:-22}" -r docker/grafana/provisioning docker/grafana/dashboards \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker/grafana/"
          scp -P "${DEPLOY_PORT:-22}" docker/keycloak/realm-export.json \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker/keycloak/realm-export.json"

      - name: Log in to GHCR on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_REGISTRY_USERNAME: ${{ secrets.DEPLOY_REGISTRY_USERNAME }}
          DEPLOY_REGISTRY_TOKEN: ${{ secrets.DEPLOY_REGISTRY_TOKEN }}
        run: |
          printf '%s' "$DEPLOY_REGISTRY_TOKEN" | \
            ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login $REGISTRY --username '$DEPLOY_REGISTRY_USERNAME' --password-stdin"

      - name: Deploy image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$DEPLOY_PATH" "$IMAGE_NAME" "$IMAGE_TAG" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          image_name="$2"
          image_tag="$3"

          cd "$deploy_path"
          export IMAGE_NAME="$image_name" IMAGE_TAG="$image_tag"
          docker compose -f docker-compose.deploy.yml pull api

          # Do not recreate stateful services during an API release. Caddy is
          # handled below: its configuration and domain variables can change
          # between releases, and --no-recreate would leave it with stale (or
          # missing) environment variables.
          if ! docker compose -f docker-compose.deploy.yml up -d --no-build --no-recreate db keycloak; then
            echo "compose startup failed; recent container logs follow"
            docker compose -f docker-compose.deploy.yml ps || true
            docker compose -f docker-compose.deploy.yml logs --tail=100 db keycloak api caddy || true
            exit 1
          fi

          if ! docker compose -f docker-compose.deploy.yml up -d --no-build --no-deps api; then
            echo "compose startup failed; recent container logs follow"
            docker compose -f docker-compose.deploy.yml ps || true
            docker compose -f docker-compose.deploy.yml logs --tail=100 db keycloak api caddy || true
            exit 1
          fi

          for attempt in $(seq 1 30); do
            health="$(docker inspect --format '{{.State.Health.Status}}' crm-api 2>/dev/null || true)"
            if [ "$health" = "healthy" ]; then
              echo "api is healthy"
              break
            fi
            if [ "$health" = "unhealthy" ]; then
              docker compose -f docker-compose.deploy.yml logs --tail=100 api
              exit 1
            fi
            sleep 2
          done

          if [ "$health" != "healthy" ]; then
            docker compose -f docker-compose.deploy.yml logs --tail=100 api
            exit 1
          fi

          # Monitoring services are not dependencies of the API. Start them
          # explicitly before Caddy so its reverse proxy can resolve grafana
          # through Docker DNS as soon as the public endpoint is available.
          if ! docker compose -f docker-compose.deploy.yml up -d --no-build prometheus grafana; then
            echo "monitoring startup failed; recent container logs follow"
            docker compose -f docker-compose.deploy.yml logs --tail=100 prometheus grafana || true
            exit 1
          fi

          sleep 2
          for container in crm-prometheus crm-grafana; do
            if [ "$(docker inspect --format '{{.State.Running}}' "$container" 2>/dev/null || true)" != "true" ]; then
              echo "$container stopped after startup; recent container logs follow"
              docker compose -f docker-compose.deploy.yml logs --tail=100 prometheus grafana || true
              exit 1
            fi
          done

          # Caddy expands DOMAIN, KEYCLOAK_DOMAIN and GRAFANA_DOMAIN only when
          # it starts. Recreate it to pick up the current values and Caddyfile;
          # otherwise a container created before a new domain was added may
          # expand a site label to an empty string and reject the Caddyfile.
          #
          # This deployment owns ports 80 and 443 through the caddy service.
          # A legacy host-level Caddy service uses the same ports and prevents
          # Docker from starting crm-caddy, so stop and disable it when present.
          if command -v systemctl >/dev/null 2>&1 && systemctl is-active --quiet caddy; then
            echo "stopping legacy host caddy service so crm-caddy can bind ports 80 and 443"
            systemctl disable --now caddy
          fi

          if ! docker compose -f docker-compose.deploy.yml up -d --no-build --no-deps --force-recreate caddy; then
            echo "caddy startup failed; recent container logs follow"
            echo "processes publishing port 80:"
            docker ps --filter publish=80 --format 'table {{.Names}}\t{{.Ports}}' || true
            docker compose -f docker-compose.deploy.yml logs --tail=100 caddy || true
            exit 1
          fi

          sleep 2
          if [ "$(docker inspect --format '{{.State.Running}}' crm-caddy 2>/dev/null || true)" != "true" ]; then
            echo "caddy stopped after startup; recent container logs follow"
            docker compose -f docker-compose.deploy.yml logs --tail=100 caddy || true
            exit 1
          fi

          docker compose -f docker-compose.deploy.yml ps
          REMOTE
